<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>August 1, 2027</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    position: relative;

    color: #263f5d;

    font-family: "Cormorant Garamond", serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 25px;

    background:
        linear-gradient(
            180deg,
            #b9d4bd 0%,
            #d9e5c9 30%,
            #e9e5c9 62%,
            #d2cda9 100%
        );
}


/* =========================================================
   DREAMY FOREST BACKGROUND
   ========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255, 247, 197, 0.65),
            transparent 27%
        ),
        radial-gradient(
            circle at 15% 30%,
            rgba(255, 224, 176, 0.28),
            transparent 20%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(255, 235, 190, 0.28),
            transparent 20%
        );

    z-index: 0;
}


/* =========================================================
   FOREST TREES
   ========================================================= */

.forest {
    position: fixed;
    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}


/* distant forest */

.forest-back {
    position: absolute;
    inset: 0;

    opacity: 0.42;

    background:
        radial-gradient(
            ellipse at 8% 78%,
            #6f8b6c 0 14%,
            transparent 14.5%
        ),
        radial-gradient(
            ellipse at 20% 72%,
            #789272 0 17%,
            transparent 17.5%
        ),
        radial-gradient(
            ellipse at 35% 77%,
            #6d896b 0 15%,
            transparent 15.5%
        ),
        radial-gradient(
            ellipse at 52% 73%,
            #789171 0 18%,
            transparent 18.5%
        ),
        radial-gradient(
            ellipse at 70% 77%,
            #6d896b 0 16%,
            transparent 16.5%
        ),
        radial-gradient(
            ellipse at 88% 72%,
            #789272 0 18%,
            transparent 18.5%
        );

    filter: blur(2px);
}


/* large left tree */

.tree-left {
    position: absolute;

    width: 180px;
    height: 115%;

    left: -55px;
    top: -5%;

    background:
        linear-gradient(
            90deg,
            #344f3d 0%,
            #47634a 55%,
            #5b7553 100%
        );

    border-radius: 50px;

    transform: rotate(5deg);

    box-shadow:
        55px 10px 0 -25px #405c44,
        95px -10px 0 -40px #536f51;
}


/* right tree */

.tree-right {
    position: absolute;

    width: 170px;
    height: 120%;

    right: -50px;
    top: -10%;

    background:
        linear-gradient(
            90deg,
            #5b7553,
            #405b43,
            #314d3b
        );

    border-radius: 50px;

    transform: rotate(-5deg);
}


/* tree branches */

.branch {
    position: absolute;

    height: 25px;

    background: #405b43;

    border-radius: 30px;

    transform-origin: left center;
}

.branch.one {
    width: 310px;
    left: 50px;
    top: 18%;
    transform: rotate(19deg);
}

.branch.two {
    width: 270px;
    left: 5px;
    top: 32%;
    transform: rotate(-14deg);
}

.branch.three {
    width: 330px;
    right: 10px;
    top: 20%;
    transform: rotate(158deg);
}

.branch.four {
    width: 280px;
    right: 20px;
    top: 35%;
    transform: rotate(194deg);
}


/* =========================================================
   LEAF CLUSTERS
   ========================================================= */

.leaves {
    position: absolute;

    width: 170px;
    height: 120px;

    opacity: 0.85;
}

.leaves span {
    position: absolute;

    width: 48px;
    height: 25px;

    background: #547452;

    border-radius: 100% 0 100% 0;

    transform-origin: bottom right;
}

.leaves span:nth-child(1) {
    left: 10px;
    top: 55px;
    transform: rotate(-35deg);
}

.leaves span:nth-child(2) {
    left: 42px;
    top: 28px;
    transform: rotate(20deg);
}

.leaves span:nth-child(3) {
    left: 78px;
    top: 58px;
    transform: rotate(-5deg);
}

.leaves span:nth-child(4) {
    left: 112px;
    top: 30px;
    transform: rotate(30deg);
}

.leaves span:nth-child(5) {
    left: 60px;
    top: 78px;
    transform: rotate(45deg);
}

.leaves.left {
    left: -5px;
    top: 9%;
}

.leaves.left2 {
    left: 10px;
    bottom: 13%;
    transform: scale(1.2);
}

.leaves.right {
    right: -10px;
    top: 10%;
    transform: scaleX(-1);
}

.leaves.right2 {
    right: 5px;
    bottom: 12%;
    transform: scaleX(-1) scale(1.2);
}


/* =========================================================
   FOREST FLOOR
   ========================================================= */

.ground {
    position: fixed;

    bottom: -100px;
    left: -5%;
    width: 110%;
    height: 240px;

    background:
        radial-gradient(
            ellipse at center,
            #82915d 0%,
            #637950 42%,
            #425c43 100%
        );

    border-radius: 50% 50% 0 0;

    opacity: 0.85;

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   DREAMY LIGHT BEAMS
   ========================================================= */

.light {
    position: fixed;

    width: 150px;
    height: 850px;

    top: -250px;

    background: linear-gradient(
        180deg,
        rgba(255,245,191,0.24),
        rgba(255,245,191,0.06),
        transparent
    );

    filter: blur(14px);

    transform: rotate(17deg);

    pointer-events: none;

    z-index: 1;

    animation: lightMove 9s ease-in-out infinite alternate;
}

.light.one {
    left: 24%;
}

.light.two {
    right: 25%;
    transform: rotate(-14deg);
    animation-delay: 2s;
}

@keyframes lightMove {

    from {
        opacity: 0.45;
        transform: translateX(-15px) rotate(17deg);
    }

    to {
        opacity: 0.75;
        transform: translateX(15px) rotate(20deg);
    }
}


/* =========================================================
   MIST
   ========================================================= */

.mist {
    position: fixed;

    width: 100%;
    height: 180px;

    bottom: 80px;
    left: 0;

    background:
        radial-gradient(
            ellipse,
            rgba(245,241,211,0.45),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;

    z-index: 1;

    animation: mistFloat 12s ease-in-out infinite alternate;
}

@keyframes mistFloat {

    from {
        transform: translateX(-30px);
        opacity: 0.45;
    }

    to {
        transform: translateX(30px);
        opacity: 0.75;
    }
}


/* =========================================================
   FLOWERS
   ========================================================= */

.flower-field {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 2;
}


/* flower container */

.flower {
    position: absolute;

    width: 50px;
    height: 60px;

    transform-origin: bottom center;

    animation:
        flowerSway 5s ease-in-out infinite;
}


/* stem */

.flower::before {
    content: "";

    position: absolute;

    width: 3px;
    height: 48px;

    background: #557452;

    left: 24px;
    top: 18px;

    border-radius: 10px;
}


/* flower center */

.flower::after {
    content: "";

    position: absolute;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #d5a950;

    left: 20px;
    top: 8px;

    z-index: 2;
}


/* petals */

.flower span {
    position: absolute;

    width: 18px;
    height: 18px;

    border-radius: 50% 50% 45% 45%;

    left: 16px;
    top: 3px;

    transform-origin: 9px 15px;
}


/* petal positions */

.flower span:nth-child(1) {
    transform: translateY(-7px);
}

.flower span:nth-child(2) {
    transform: rotate(72deg) translateY(-7px);
}

.flower span:nth-child(3) {
    transform: rotate(144deg) translateY(-7px);
}

.flower span:nth-child(4) {
    transform: rotate(216deg) translateY(-7px);
}

.flower span:nth-child(5) {
    transform: rotate(288deg) translateY(-7px);
}


/* flower colors */

.flower.pink span {
    background: #e9a7b5;
}

.flower.white span {
    background: #fff7e8;
}

.flower.lilac span {
    background: #c8b4dc;
}

.flower.yellow span {
    background: #f3d77b;
}

.flower.peach span {
    background: #efb18e;
}


@keyframes flowerSway {

    0%, 100% {
        transform: rotate(-3deg);
    }

    50% {
        transform: rotate(4deg);
    }
}


/* individual flowers */

.f1 {
    left: 5%;
    bottom: 7%;
    transform: scale(1.4);
}

.f2 {
    left: 12%;
    bottom: 3%;
    animation-delay: 1s;
    transform: scale(0.9);
}

.f3 {
    left: 20%;
    bottom: 5%;
    animation-delay: 2s;
    transform: scale(1.15);
}

.f4 {
    right: 5%;
    bottom: 6%;
    animation-delay: 1.5s;
    transform: scale(1.4);
}

.f5 {
    right: 14%;
    bottom: 2%;
    animation-delay: 2.5s;
    transform: scale(0.95);
}

.f6 {
    right: 22%;
    bottom: 5%;
    animation-delay: 0.5s;
    transform: scale(1.2);
}


/* =========================================================
   LITTLE WILDFLOWERS
   ========================================================= */

.wildflowers {
    position: absolute;

    bottom: 0;

    width: 100%;

    height: 170px;
}

.wildflowers span {
    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    box-shadow:
        0 -6px 0 #f2c9d4,
        6px 0 0 #f2c9d4,
        -6px 0 0 #f2c9d4,
        0 6px 0 #f2c9d4;

    animation: tinyFlower 4s ease-in-out infinite;
}

.wildflowers span:nth-child(1) {
    left: 8%;
    bottom: 50px;
}

.wildflowers span:nth-child(2) {
    left: 27%;
    bottom: 35px;
    animation-delay: 1s;
}

.wildflowers span:nth-child(3) {
    left: 42%;
    bottom: 70px;
    animation-delay: 2s;
}

.wildflowers span:nth-child(4) {
    right: 30%;
    bottom: 42px;
    animation-delay: 1.5s;
}

.wildflowers span:nth-child(5) {
    right: 10%;
    bottom: 65px;
    animation-delay: 0.7s;
}

@keyframes tinyFlower {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* =========================================================
   FLOATING PETALS
   ========================================================= */

.petal {
    position: fixed;

    width: 11px;
    height: 7px;

    border-radius: 100% 0 100% 0;

    background: rgba(246, 193, 207, 0.85);

    pointer-events: none;

    z-index: 3;

    animation: petalFloat linear infinite;
}

.petal.p2 {
    background: rgba(255, 235, 175, 0.8);
}

.petal.p3 {
    background: rgba(220, 190, 225, 0.8);
}

.petal:nth-child(1) {
    left: 8%;
    top: -10px;
    animation-duration: 12s;
}

.petal:nth-child(2) {
    left: 24%;
    top: -20px;
    animation-duration: 15s;
    animation-delay: 3s;
}

.petal:nth-child(3) {
    left: 44%;
    top: -30px;
    animation-duration: 13s;
    animation-delay: 1s;
}

.petal:nth-child(4) {
    left: 63%;
    top: -20px;
    animation-duration: 17s;
    animation-delay: 5s;
}

.petal:nth-child(5) {
    left: 80%;
    top: -30px;
    animation-duration: 14s;
    animation-delay: 2s;
}

.petal:nth-child(6) {
    left: 92%;
    top: -10px;
    animation-duration: 16s;
    animation-delay: 7s;
}

@keyframes petalFloat {

    0% {
        transform:
            translate3d(0, -20px, 0)
            rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 0.9;
    }

    50% {
        transform:
            translate3d(80px, 50vh, 0)
            rotate(180deg);
    }

    100% {
        transform:
            translate3d(-50px, 110vh, 0)
            rotate(360deg);
        opacity: 0;
    }
}


/* =========================================================
   FIREFLY / GLOW PARTICLES
   ========================================================= */

.fireflies {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 3;
}

.firefly {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff1a8;

    box-shadow:
        0 0 8px rgba(255,240,150,0.9),
        0 0 18px rgba(255,240,150,0.55);

    animation: fireflyGlow 3s ease-in-out infinite;
}

.firefly:nth-child(1) {
    left: 14%;
    top: 24%;
}

.firefly:nth-child(2) {
    left: 28%;
    top: 42%;
    animation-delay: 1s;
}

.firefly:nth-child(3) {
    left: 72%;
    top: 30%;
    animation-delay: 1.8s;
}

.firefly:nth-child(4) {
    left: 84%;
    top: 51%;
    animation-delay: 0.7s;
}

.firefly:nth-child(5) {
    left: 18%;
    top: 63%;
    animation-delay: 2.3s;
}

.firefly:nth-child(6) {
    left: 89%;
    top: 70%;
    animation-delay: 1.3s;
}

.firefly:nth-child(7) {
    left: 56%;
    top: 17%;
    animation-delay: 2.7s;
}

@keyframes fireflyGlow {

    0%,100% {
        opacity: 0.15;
        transform: translateY(0) scale(0.7);
    }

    50% {
        opacity: 1;
        transform: translateY(-12px) scale(1.2);
    }
}


/* =========================================================
   BUTTERFLIES
   ========================================================= */

.butterfly {
    position: fixed;

    width: 28px;
    height: 24px;

    pointer-events: none;

    z-index: 4;

    animation: butterflyMove 18s linear infinite;
}

.butterfly::before,
.butterfly::after {
    content: "";

    position: absolute;

    width: 14px;
    height: 20px;

    border-radius: 80% 20% 70% 30%;

    background: rgba(177, 143, 190, 0.68);
}

.butterfly::before {
    left: 0;
    transform-origin: right center;
    animation: wingLeft 0.7s ease-in-out infinite alternate;
}

.butterfly::after {
    right: 0;

    transform:
        scaleX(-1);

    transform-origin: left center;

    animation: wingRight 0.7s ease-in-out infinite alternate;
}

.butterfly.one {
    left: -40px;
    top: 25%;
}

.butterfly.two {
    left: -60px;
    top: 68%;

    animation-delay: 8s;
}

@keyframes butterflyMove {

    0% {
        transform:
            translate(0, 0)
            rotate(5deg);
    }

    25% {
        transform:
            translate(25vw, -30px)
            rotate(-7deg);
    }

    50% {
        transform:
            translate(50vw, 40px)
            rotate(8deg);
    }

    75% {
        transform:
            translate(75vw, -20px)
            rotate(-5deg);
    }

    100% {
        transform:
            translate(110vw, 20px)
            rotate(6deg);
    }
}

@keyframes wingLeft {

    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(65deg);
    }
}

@keyframes wingRight {

    from {
        transform: scaleX(-1) rotateY(0deg);
    }

    to {
        transform: scaleX(-1) rotateY(65deg);
    }
}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.container {
    width: min(1100px, 100%);

    text-align: center;

    position: relative;

    z-index: 10;

    padding: 45px 35px;

    border-radius: 35px;

    background:
        linear-gradient(
            rgba(255, 251, 237, 0.68),
            rgba(250, 247, 228, 0.56)
        );

    backdrop-filter: blur(7px);

    box-shadow:
        0 25px 70px rgba(40, 65, 43, 0.18),
        inset 0 0 45px rgba(255,255,255,0.3);

    border: 1px solid rgba(255,255,255,0.55);

    animation: containerAppear 1.5s ease both;
}

@keyframes containerAppear {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   DATE
   ========================================================= */

.date {
    font-family: "Montserrat", sans-serif;

    font-size: 15px;

    letter-spacing: 8px;

    color: #9b7943;

    margin-bottom: 25px;

    animation: fadeDown 1s ease 0.3s both;
}


/* =========================================================
   TITLE
   ========================================================= */

h1 {
    margin: 0;

    font-size: clamp(55px, 7vw, 90px);

    font-weight: 500;

    line-height: 1;

    color: #294666;

    text-shadow:
        0 2px 8px rgba(60,70,80,0.08);

    animation: titleFloat 5s ease-in-out infinite;
}

@keyframes titleFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-3px);
    }
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 22px;

    margin: 35px auto 55px;

    width: min(600px, 80%);

    animation: fadeIn 1.5s ease 0.5s both;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    background: #b89555;

    flex: 1;
}

.heart {
    font-size: 28px;

    color: #b89555;

    animation: heartPulse 2.2s ease-in-out infinite;
}

@keyframes heartPulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}


/* =========================================================
   COUNTDOWN
   ========================================================= */

.countdown {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 24px;

    width: 100%;
}


/* =========================================================
   COUNTDOWN CARD
   ========================================================= */

.card {
    min-height: 190px;

    border: 1px solid rgba(184,149,85,0.65);

    border-radius: 25px;

    background:
        rgba(255,252,245,0.67);

    backdrop-filter: blur(6px);

    box-shadow:
        0 12px 35px rgba(80,70,50,0.08),
        inset 0 0 25px rgba(255,255,255,0.3);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    transition:
        transform 0.4s ease,
        box-shadow 0.4s ease;

    animation: cardAppear 1s ease both;
}

.card:nth-child(1) {
    animation-delay: 0.5s;
}

.card:nth-child(2) {
    animation-delay: 0.7s;
}

.card:nth-child(3) {
    animation-delay: 0.9s;
}

.card:nth-child(4) {
    animation-delay: 1.1s;
}

.card:hover {
    transform: translateY(-7px);

    box-shadow:
        0 18px 40px rgba(80,70,50,0.14),
        inset 0 0 25px rgba(255,255,255,0.35);
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   NUMBER
   ========================================================= */

.number {
    font-size: clamp(55px, 6vw, 80px);

    line-height: 1;

    font-weight: 500;

    color: #294666;

    transition: transform 0.25s ease;
}


/* =========================================================
   LABEL
   ========================================================= */

.label {
    margin-top: 15px;

    font-family: "Montserrat", sans-serif;

    font-size: 13px;

    letter-spacing: 5px;

    color: #817967;
}


/* =========================================================
   LITTLE HEART
   ========================================================= */

.card-heart {
    margin-top: 18px;

    font-size: 20px;

    color: #b89555;

    animation: tinyHeart 2.5s ease-in-out infinite;
}

@keyframes tinyHeart {

    0%,100% {
        opacity: 0.65;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* =========================================================
   GENERAL ANIMATIONS
   ========================================================= */

@keyframes fadeDown {

    from {
        opacity: 0;
        transform: translateY(-15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    body {
        padding: 25px 15px;
    }

    .container {
        padding: 35px 18px;
    }

    .date {
        font-size: 12px;
        letter-spacing: 5px;
    }

    h1 {
        font-size: 50px;
    }

    .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .card {
        min-height: 150px;
    }

    .number {
        font-size: 55px;
    }

    .tree-left,
    .tree-right {
        opacity: 0.8;
    }

    .butterfly {
        transform: scale(0.7);
    }

}


/* =========================================================
   VERY SMALL SCREENS
   ========================================================= */

@media (max-width: 400px) {

    h1 {
        font-size: 42px;
    }

    .number {
        font-size: 45px;
    }

    .label {
        font-size: 10px;
        letter-spacing: 3px;
    }

    .container {
        padding: 30px 12px;
    }

    .flower {
        transform: scale(0.75);
    }

}

</style>
</head>


<body>


<!-- =====================================================
     FOREST
     ===================================================== -->

    </div>

</div>


<script>


/* =====================================================
   COUNTDOWN
   ===================================================== */

const targetDate =
    new Date("August 1, 2027 00:00:00").getTime();


function updateCountdown() {

    const now =
        new Date().getTime();

    const difference =
        targetDate - now;


    if (difference <= 0) {

        document.getElementById("days").innerHTML = "00";

        document.getElementById("hours").innerHTML = "00";

        document.getElementById("minutes").innerHTML = "00";

        document.getElementById("seconds").innerHTML = "00";

        return;
    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (
                difference %
                (1000 * 60 * 60 * 24)
            )
            /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (
                difference %
                (1000 * 60 * 60)
            )
            /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (
                difference %
                (1000 * 60)
            )
            /
            1000
        );


    document.getElementById("days").innerHTML =
        days;


    document.getElementById("hours").innerHTML =
        String(hours).padStart(2, "0");


    document.getElementById("minutes").innerHTML =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds").innerHTML =
        String(seconds).padStart(2, "0");

}


updateCountdown();

setInterval(updateCountdown, 1000);


/* =====================================================
   SUBTLE NUMBER CHANGE ANIMATION
   ===================================================== */

let previousValues = {};

setInterval(() => {

    const ids = [
        "days",
        "hours",
        "minutes",
        "seconds"
    ];

    ids.forEach(id => {

        const element =
            document.getElementById(id);

        const value =
            element.innerHTML;

        if (
            previousValues[id] !== undefined &&
            previousValues[id] !== value
        ) {

            element.style.transform =
                "translateY(-5px) scale(1.04)";

            setTimeout(() => {

                element.style.transform =
                    "translateY(0) scale(1)";

            }, 250);

        }

        previousValues[id] = value;

    });

}, 1000);


</script>
