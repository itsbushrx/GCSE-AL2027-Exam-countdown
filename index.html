<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>August 1, 2027</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 50% 45%, #18213a 0%, #090c16 45%, #030409 100%);

            color: #f5f1ea;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }

        /* Stars */

        .stars,
        .stars::before,
        .stars::after {
            position: fixed;
            inset: 0;
            content: "";
            pointer-events: none;
        }

        .stars {
            background-image:
                radial-gradient(1px 1px at 10% 20%, white, transparent),
                radial-gradient(1px 1px at 20% 70%, white, transparent),
                radial-gradient(1px 1px at 35% 30%, white, transparent),
                radial-gradient(1px 1px at 50% 15%, white, transparent),
                radial-gradient(1px 1px at 65% 65%, white, transparent),
                radial-gradient(1px 1px at 80% 25%, white, transparent),
                radial-gradient(1px 1px at 90% 75%, white, transparent),
                radial-gradient(1px 1px at 45% 85%, white, transparent),
                radial-gradient(1px 1px at 75% 90%, white, transparent);

            animation: twinkle 5s infinite alternate;
        }

        .stars::before {
            background-image:
                radial-gradient(1px 1px at 15% 45%, white, transparent),
                radial-gradient(1px 1px at 28% 10%, white, transparent),
                radial-gradient(1px 1px at 58% 35%, white, transparent),
                radial-gradient(1px 1px at 72% 55%, white, transparent),
                radial-gradient(1px 1px at 88% 15%, white, transparent);
            opacity: 0.5;
        }

        @keyframes twinkle {
            from {
                opacity: 0.35;
            }
            to {
                opacity: 0.9;
            }
        }

        /* Main content */

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 900px;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .small-date {
            font-size: 12px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #aaaebc;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 45px;

            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(42px, 7vw, 75px);
            font-weight: 400;
            letter-spacing: 2px;

            text-shadow: 0 0 25px rgba(255,255,255,0.15);
        }

        /* Countdown */

        .countdown {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .box {
            width: 150px;
            padding: 25px 15px;

            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 25px rgba(0,0,0,0.25),
                inset 0 0 20px rgba(255,255,255,0.015);
        }

        .number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 58px;
            font-weight: 500;
            line-height: 1;
        }

        .label {
            margin-top: 12px;
            font-size: 10px;
            letter-spacing: 3px;
            color: #9da2b0;
        }

        .message {
            margin-top: 55px;

            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-style: italic;

            color: #c9c5bd;
        }

        .heart {
            display: inline-block;
            margin-left: 5px;
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            h1 {
                margin-bottom: 30px;
            }

            .countdown {
                gap: 10px;
            }

            .box {
                width: 135px;
                padding: 20px 10px;
            }

            .number {
                font-size: 48px;
            }

            .message {
                margin-top: 35px;
                font-size: 19px;
            }
        }

    </style>
</head>

<body>

    <div class="stars"></div>

    <main class="container">

        <div class="small-date">
            01 · 08 · 2027
        </div>

        <h1>
            Until August 1st...
        </h1>

        <div class="countdown">

            <div class="box">
                <div class="number" id="days">0</div>
                <div class="label">DAYS</div>
            </div>

            <div class="box">
                <div class="number" id="hours">0</div>
                <div class="label">HOURS</div>
            </div>

            <div class="box">
                <div class="number" id="minutes">0</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="box">
                <div class="number" id="seconds">0</div>
                <div class="label">SECONDS</div>
            </div>

        </div>

        <div class="message">
            Counting down to the day...
            <span class="heart">♡</span>
        </div>

    </main>

    <script>

        const targetDate = new Date("August 1, 2027 00:00:00").getTime();

        function updateCountdown() {

            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {

                document.getElementById("days").innerHTML = "0";
                document.getElementById("hours").innerHTML = "0";
                document.getElementById("minutes").innerHTML = "0";
                document.getElementById("seconds").innerHTML = "0";

                document.querySelector(".message").innerHTML =
                    "It's finally August 1st. ♡";

                return;
            }

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference % (1000 * 60 * 60 * 24))
                / (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (difference % (1000 * 60 * 60))
                / (1000 * 60)
            );

            const seconds = Math.floor(
                (difference % (1000 * 60))
                / 1000
            );

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
