<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>August 1, 2027</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        linear-gradient(
            rgba(248, 242, 231, 0.88),
            rgba(248, 242, 231, 0.88)
        ),
        url("floral-bg.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: #263f5d;

    font-family: "Cormorant Garamond", serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 25px;
}


/* MAIN CONTENT */

.container {
    width: min(1100px, 100%);
    text-align: center;
}


/* DATE */

.date {
    font-family: "Montserrat", sans-serif;
    font-size: 15px;
    letter-spacing: 8px;
    color: #a7864c;
    margin-bottom: 25px;
}


/* TITLE */

h1 {
    margin: 0;

    font-size: clamp(55px, 7vw, 90px);
    font-weight: 500;
    line-height: 1;

    color: #294666;

    text-shadow: 0 2px 8px rgba(60, 70, 80, 0.08);
}


/* GOLD DIVIDER */

.divider {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 22px;

    margin: 35px auto 55px;

    width: min(600px, 80%);
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;
    background: #b89555;

    flex: 1;
}

.heart {
    font-size: 28px;
    color: #b89555;
}


/* COUNTDOWN */

.countdown {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 24px;

    width: 100%;
}


/* COUNTDOWN CARD */

.card {
    min-height: 190px;

    border: 1px solid rgba(184, 149, 85, 0.65);

    border-radius: 25px;

    background: rgba(255, 252, 245, 0.62);

    backdrop-filter: blur(4px);

    box-shadow:
        0 12px 35px rgba(80, 70, 50, 0.08),
        inset 0 0 25px rgba(255,255,255,0.25);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    transition: transform 0.3s ease;
}

.card:hover {
    transform: translateY(-4px);
}


/* NUMBER */

.number {
    font-size: clamp(55px, 6vw, 80px);

    line-height: 1;

    font-weight: 500;

    color: #294666;
}


/* LABEL */

.label {
    margin-top: 15px;

    font-family: "Montserrat", sans-serif;

    font-size: 13px;

    letter-spacing: 5px;

    color: #817967;
}


/* LITTLE HEART */

.card-heart {
    margin-top: 18px;

    font-size: 20px;

    color: #b89555;
}


/* MOBILE */

@media (max-width: 700px) {

    body {
        padding: 30px 18px;
    }

    .date {
        font-size: 12px;
        letter-spacing: 5px;
    }

    h1 {
        font-size: 50px;
    }

    .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .card {
        min-height: 150px;
    }

    .number {
        font-size: 55px;
    }

}


/* VERY SMALL SCREENS */

@media (max-width: 400px) {

    h1 {
        font-size: 42px;
    }

    .number {
        font-size: 45px;
    }

    .label {
        font-size: 10px;
        letter-spacing: 3px;
    }

}

</style>
</head>


<body>

<div class="container">

    <div class="date">
        ♡ &nbsp; 01 · 08 · 2027 &nbsp; ♡
    </div>


    <h1>
        Until August 1st...
    </h1>


    <div class="divider">
        <div class="heart">♡</div>
    </div>


    <div class="countdown">

        <div class="card">
            <div class="number" id="days">000</div>
            <div class="label">DAYS</div>
            <div class="card-heart">♡</div>
        </div>


        <div class="card">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
            <div class="card-heart">♡</div>
        </div>


        <div class="card">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
            <div class="card-heart">♡</div>
        </div>


        <div class="card">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDS</div>
            <div class="card-heart">♡</div>
        </div>

    </div>

</div>


<script>

const targetDate =
    new Date("August 1, 2027 00:00:00").getTime();


function updateCountdown() {

    const now = new Date().getTime();

    const difference = targetDate - now;


    if (difference <= 0) {

        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";

        return;
    }


    const days =
        Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference % (1000 * 60 * 60 * 24))
            / (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (difference % (1000 * 60 * 60))
            / (1000 * 60)
        );


    const seconds =
        Math.floor(
            (difference % (1000 * 60))
            / 1000
        );


    document.getElementById("days").innerHTML =
        days;


    document.getElementById("hours").innerHTML =
        String(hours).padStart(2, "0");


    document.getElementById("minutes").innerHTML =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds").innerHTML =
        String(seconds).padStart(2, "0");

}


updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
